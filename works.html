</head><body class="works-page"><a class="skip" href="#main">本文へ移動</a><header><div class="container nav"><a class="logo" href="/"><img class="logo-mark" src="/logo-mark-small.webp" alt="" width="36" height="36"><span>Beyond CG Studio</span></a><nav class="navlinks" aria-label="メインナビゲーション"><a href="/architectural-rendering">建築パース制作</a><a href="/works">制作実績</a><a class="contact" href="/#contact">見積もりを相談</a></nav></div></header><main id="main"><section id="works"><div class="container"><div class="section-head"><span class="eyebrow">WORKS ARCHIVE</span><div><h1>制作実績</h1><p>飲食店、クリニック、住宅、ホテルなど、これまでに制作した建築CGパースをご覧いただけます。画像は元の縦横比で掲載しています。各作品には、Beyond CG Studioによる制作コメントを添えています。</p></div></div><div class="work-filters" aria-label="制作実績の絞り込み"><button type="button" class="active" data-filter="all">すべて</button><button type="button" data-filter="store">店舗</button><button type="button" data-filter="residence">住宅</button><button type="button" data-filter="medical">医療・美容</button><button type="button" data-filter="hospitality">宿泊施設</button></div><div class="works"><figure class="work"><img src="/works-images/dental-clinic-waiting-room-cg.webp" alt="歯科医院の待合室を表現した内観CGパース" width="1920" height="1080" decoding="async" fetchpriority="high"><figcaption><strong>歯科医院 待合室</strong>クリニック / 内観CG<span class="work-note"><b>制作コメント</b>清潔感と安心感が伝わるよう、白と木目のバランス、間接照明の柔らかさを意識しました。</span><a class="work-detail" href="/works/dental-clinic">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/ginza-sushi-restaurant-interior.webp" alt="東京銀座の寿司店を表現した内観CGパース" width="3840" height="2160" loading="lazy" decoding="async"><figcaption><strong>東京銀座 寿司店</strong>店舗 / 内観CG<span class="work-note"><b>制作コメント</b>カウンターを主役に、木の温かさと店内の奥行きが伝わる視点・照明を構成しました。</span><a class="work-detail" href="/works/ginza-sushi-restaurant">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/kyoto-kominka-renovation-cg.webp" alt="京都の古民家改装を表現した建築CGパース" width="3840" height="2160" loading="lazy" decoding="async"><figcaption><strong>京都 古民家改装</strong>住宅 / 建築CG<span class="work-note"><b>制作コメント</b>古民家らしい意匠と改装後の表情が伝わるよう、外壁・木部の素材感と陰影を整理しました。</span><a class="work-detail" href="/works/kyoto-kominka">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/hotel-lobby-interior-rendering.webp" alt="ホテルロビーを表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>ホテルロビー</strong>宿泊施設 / 内観CG<span class="work-note"><b>制作コメント</b>落ち着きと上質さを感じられるよう、壁面の重厚感と照明による奥行きを丁寧に表現しました。</span><a class="work-detail" href="/works/hotel-lobby">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/korean-restaurant-interior-rendering.webp" alt="鶴橋の韓国料理店の内観CGパース" width="1344" height="768" loading="lazy" decoding="async"><figcaption><strong>鶴橋 韓国料理店</strong>店舗 / 内観CG<span class="work-note"><b>制作コメント</b>活気ある飲食空間を想像できるよう、客席配置と木質素材、暖色照明の見え方を整えました。</span><a class="work-detail" href="/works/korean-restaurant">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/korean-restaurant-interior-angle-2.webp" alt="鶴橋の韓国料理店の別アングル内観CGパース" width="3840" height="2160" loading="lazy" decoding="async"><figcaption><strong>鶴橋 韓国料理店</strong>店舗 / 内観CG・別アングル<span class="work-note"><b>制作コメント</b>入口から客席までの動線と席数の把握がしやすいよう、空間全体を見渡せる構図にしました。</span><a class="work-detail" href="/works/korean-restaurant">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/ginza-sushi-restaurant-angle-2.webp" alt="東京銀座の寿司店の別アングル内観CGパース" width="1920" height="1080" loading="lazy" decoding="async"><figcaption><strong>東京銀座 寿司店</strong>店舗 / 内観CG・別アングル<span class="work-note"><b>制作コメント</b>客席から見たカウンターの存在感と距離感を確認できるよう、別視点から空間を表現しました。</span><a class="work-detail" href="/works/ginza-sushi-restaurant">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/dental-clinic-interior-cg.webp" alt="歯科医院の内観CGパース" width="1920" height="1080" loading="lazy" decoding="async"><figcaption><strong>歯科医院</strong>クリニック / 内観CG<span class="work-note"><b>制作コメント</b>院内の明るさと清潔感に加え、受付から各スペースへのつながりが分かる構成を意識しました。</span><a class="work-detail" href="/works/dental-clinic">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/tower-mansion-1.webp" alt="タワーマンションのダイニングを表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>タワーマンション</strong>住宅 / 内観CG・ダイニング<span class="work-note"><b>制作コメント</b>開放感のあるダイニングを伝えるため、自然光の広がりと家具・キッチンの距離感を表現しました。</span><a class="work-detail" href="/works/tower-mansion">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/tower-mansion-2.webp" alt="タワーマンションのキッチンを表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>タワーマンション</strong>住宅 / 内観CG・キッチン<span class="work-note"><b>制作コメント</b>収納量や作業動線が読み取れるよう、キッチンの形状と面材・天板の質感を明確にしました。</span><a class="work-detail" href="/works/tower-mansion">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/tower-mansion-3.webp" alt="タワーマンションのリビングを表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>タワーマンション</strong>住宅 / 内観CG・リビング<span class="work-note"><b>制作コメント</b>眺望と室内の関係を主役に、窓からの光とリビング・ダイニングの連続性を表現しました。</span><a class="work-detail" href="/works/tower-mansion">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/restaurant-exterior.webp" alt="飲食店の入口ファサードを表現した外観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>飲食店</strong>店舗 / 外観CG<span class="work-note"><b>制作コメント</b>通行者から見た入口の印象を確認できるよう、外装材、ガラス面、店内照明の見え方を整えました。</span><a class="work-detail" href="/works/restaurant-exterior">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/share-salon-1.webp" alt="シェアサロンの待合スペースを表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>某シェアサロン</strong>美容施設 / 内観CG・待合<span class="work-note"><b>制作コメント</b>アートを印象的に見せながら、受付前の待合スペースに親しみと華やかさを持たせました。</span><a class="work-detail" href="/works/share-salon">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/share-salon-2.webp" alt="シェアサロンの受付を表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>某シェアサロン</strong>美容施設 / 内観CG・受付<span class="work-note"><b>制作コメント</b>受付までの動線と素材の切り替えが分かるよう、木目と大理石調カウンターの対比を表現しました。</span><a class="work-detail" href="/works/share-salon">この実績の詳細を見る</a></figcaption></figure><figure class="work"><img src="/works-images/tokyo-bar.webp" alt="東京のバー店内を表現した内観CGパース" width="2560" height="1440" loading="lazy" decoding="async"><figcaption><strong>東京 BAR</strong>店舗 / 内観CG<span class="work-note"><b>制作コメント</b>落ち着いた夜の雰囲気を伝えるため、青みのある壁面とカウンター照明のコントラストを整えました。</span><a class="work-detail" href="/works/tokyo-bar">この実績の詳細を見る</a></figcaption></figure></div></div></section><section class="cta"><div class="container"><span class="eyebrow">CONTACT</span><h2>プロジェクトについて、<br>お聞かせください。</h2><p>用途、希望カット数、納期など、分かる範囲でご相談いただけます。</p><div class="buttons" style="justify-content:center"><a class="button primary" href="/#contact">見積もり・制作を相談する</a></div></div></section></main><footer><div class="container footerrow"><a class="logo" href="/"><img class="logo-mark" src="/logo-mark-small.webp" alt="" width="36" height="36"><span>Beyond CG Studio</span></a><span>全国オンライン対応｜大阪市西区江戸堀</span><a href="/about">事業者プロフィール</a><a href="/privacy">プライバシーポリシー</a></div></footer><div class="lightbox" id="works-lightbox" role="dialog" aria-modal="true" aria-label="制作実績の拡大画像" aria-hidden="true"><button class="lightbox-close" type="button" aria-label="拡大表示を閉じる">&times;</button><div class="lightbox-content"><img class="lightbox-image" alt=""><div class="lightbox-caption"></div></div></div><script>(()=>{const box=document.getElementById("works-lightbox"),image=box.querySelector(".lightbox-image"),caption=box.querySelector(".lightbox-caption"),close=box.querySelector(".lightbox-close");let last=null;const hide=()=>{box.classList.remove("active");box.setAttribute("aria-hidden","true");document.body.classList.remove("lightbox-open");image.removeAttribute("src");last?.focus()};document.querySelectorAll(".work").forEach(item=>{item.tabIndex=0;item.setAttribute("role","button");item.setAttribute("aria-label",(item.querySelector("strong")?.textContent||"制作実績")+"を拡大表示");const show=()=>{const source=item.querySelector("img");last=item;image.src=source.currentSrc||source.src;image.alt=source.alt;caption.textContent=item.querySelector("figcaption")?.innerText||source.alt;box.classList.add("active");box.setAttribute("aria-hidden","false");document.body.classList.add("lightbox-open");close.focus()};item.addEventListener("click",event=>{if(event.target.closest("a"))return;show()});item.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&!event.target.closest("a")){event.preventDefault();show()}})});close.addEventListener("click",hide);box.addEventListener("click",event=>{if(event.target===box)hide()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&box.classList.contains("active"))hide()})})();</script><script>(()=>{const buttons=document.querySelectorAll(".work-filters button"),items=document.querySelectorAll(".work");const category=item=>{const text=item.textContent;return text.includes("住宅")?"residence":text.includes("クリニック")||text.includes("美容施設")?"medical":text.includes("宿泊施設")?"hospitality":"store"};buttons.forEach(button=>button.addEventListener("click",()=>{buttons.forEach(current=>current.classList.remove("active"));button.classList.add("active");items.forEach(item=>{item.hidden=button.dataset.filter!=="all"&&category(item)!==button.dataset.filter})}))})();</script></body></html>
